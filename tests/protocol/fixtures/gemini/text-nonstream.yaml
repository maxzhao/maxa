# gemini-native/text-nonstream: single non-stream generateContent response.
# chunks[1] is the raw JSON response body; parse_nonstream emits the terminal
# completed itself.
id: gemini-native/text-nonstream
protocol: gemini
mode: non_streamed
request:
  normalized_messages:
    - role: user
      content:
        - type: text
          text: Reply in one sentence.
  normalized_tools: []
  provider_options:
    model: gemini-2.5-flash
  expected_body:
    contents:
      - role: user
        parts:
          - text: Reply in one sentence.
response:
  chunks:
    - '{"candidates":[{"content":{"role":"model","parts":[{"text":"Non-stream reply"}]},"finishReason":"STOP"}],"usageMetadata":{"promptTokenCount":8,"candidatesTokenCount":3,"totalTokenCount":11}}'
  expected_events:
    - response_started
    - message_delta
    - finish_reason
    - usage_updated
    - completed
  expected_message:
    role: assistant
    content:
      - type: text
        text: Non-stream reply
  expected_tool_calls: []
  expected_usage:
    input_tokens: 8
    output_tokens: 3
    total_tokens: 11
    provider_reported_total: 11
    source: provider_final
    final: true
  expected_terminal: completed
