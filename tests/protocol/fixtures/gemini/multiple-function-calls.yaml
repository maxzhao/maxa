# gemini-native/multiple-function-calls: two functionCall parts in ONE envelope,
# both with provider ids (fc-1/fc-2 -> provider identity preserved). Each call
# emits tool_call_started + tool_call_completed in part order; finishReason=STOP.
id: gemini-native/multiple-function-calls
protocol: gemini
mode: streamed
request:
  normalized_messages:
    - role: user
      content:
        - type: text
          text: Weather in Beijing and Shanghai.
  normalized_tools:
    - name: get_weather
      description: Get the current weather for a city
      parameters:
        type: object
        properties:
          city:
            type: string
        required:
          - city
  provider_options:
    model: gemini-2.5-flash
  expected_body:
    contents:
      - role: user
        parts:
          - text: Weather in Beijing and Shanghai.
    tools:
      - functionDeclarations:
          - name: get_weather
            description: Get the current weather for a city
            parameters:
              type: object
              properties:
                city:
                  type: string
              required:
                - city
response:
  chunks:
    - 'data: {"candidates":[{"content":{"role":"model","parts":[{"functionCall":{"id":"fc-1","name":"get_weather","args":{"city":"Beijing"}}},{"functionCall":{"id":"fc-2","name":"get_weather","args":{"city":"Shanghai"}}}]},"finishReason":"STOP"}]}'
    - 'data: [DONE]'
  expected_events:
    - response_started
    - tool_call_started
    - tool_call_completed
    - tool_call_started
    - tool_call_completed
    - finish_reason
    - completed
  expected_message:
    role: assistant
    content:
      - type: tool_call
        call_id: fc-1
        name: get_weather
        arguments: '{"city":"Beijing"}'
      - type: tool_call
        call_id: fc-2
        name: get_weather
        arguments: '{"city":"Shanghai"}'
  expected_tool_calls:
    - call_id: fc-1
      name: get_weather
      arguments:
        city: Beijing
    - call_id: fc-2
      name: get_weather
      arguments:
        city: Shanghai
  expected_usage: {}
  expected_terminal: completed
