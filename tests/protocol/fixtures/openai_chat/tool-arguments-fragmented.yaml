# openai-chat/tool-arguments-fragmented: streamed tool call with fragmented
# arguments accumulated by protocol index (UTF-8 fragments concatenated, JSON
# decoded only at the tool boundary). Provider id present -> no synthetic id.
id: openai-chat/tool-arguments-fragmented
protocol: openai_chat
mode: streamed
request:
  normalized_messages:
    - role: user
      content:
        - type: text
          text: What is the weather in London?
  normalized_tools:
    - type: function
      function:
        name: get_weather
        description: Get the current weather for a location
        parameters:
          type: object
          properties:
            location:
              type: string
            units:
              type: string
          required:
            - location
  provider_options:
    model: deepseek-v4-flash
    stream: true
  expected_body:
    model: deepseek-v4-flash
    messages:
      - role: user
        content: What is the weather in London?
    stream: true
    stream_options:
      include_usage: true
    tools:
      - type: function
        function:
          name: get_weather
          description: Get the current weather for a location
          parameters:
            type: object
            properties:
              location:
                type: string
              units:
                type: string
            required:
              - location
response:
  chunks:
    - 'data: {"id":"chatcmpl-3","object":"chat.completion.chunk","created":123458,"model":"deepseek-v4-flash","choices":[{"index":0,"delta":{"role":"assistant","content":""},"finish_reason":null}]}'
    - 'data: {"id":"chatcmpl-3","object":"chat.completion.chunk","created":123458,"model":"deepseek-v4-flash","choices":[{"index":0,"delta":{"tool_calls":[{"index":0,"id":"call_abc123","type":"function","function":{"name":"get_weather","arguments":""}}]},"finish_reason":null}]}'
    - 'data: {"id":"chatcmpl-3","object":"chat.completion.chunk","created":123458,"model":"deepseek-v4-flash","choices":[{"index":0,"delta":{"tool_calls":[{"index":0,"function":{"arguments":"{\"location\": \"Lon"}}]},"finish_reason":null}]}'
    - 'data: {"id":"chatcmpl-3","object":"chat.completion.chunk","created":123458,"model":"deepseek-v4-flash","choices":[{"index":0,"delta":{"tool_calls":[{"index":0,"function":{"arguments":"don\", \"units\": \"celsius\"}"}}]},"finish_reason":null}]}'
    - 'data: {"id":"chatcmpl-3","object":"chat.completion.chunk","created":123458,"model":"deepseek-v4-flash","choices":[{"index":0,"delta":{},"finish_reason":"tool_calls"}]}'
    - 'data: [DONE]'
  expected_events:
    - tool_call_started
    - tool_args_delta
    - tool_args_delta
    - tool_call_completed
    - finish_reason
    - completed
  expected_message:
    role: assistant
    content:
      - type: tool_call
        call_id: call_abc123
        name: get_weather
        arguments: '{"location": "London", "units": "celsius"}'
  expected_tool_calls:
    - call_id: call_abc123
      name: get_weather
      arguments:
        location: London
        units: celsius
  expected_usage: {}
  expected_terminal: completed
