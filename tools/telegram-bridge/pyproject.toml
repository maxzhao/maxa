[project]
name = "telegram-bridge"
version = "0.1.0"
description = "Maxa Telegram forum topic bridge for CodeCompanion sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp-socks>=0.9,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "pyromark>=0.9.13,<1",
    "uvicorn>=0.30,<1",
    "wcwidth>=0.2,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[project.scripts]
maxa-telegram-bridge = "telegram_bridge.__main__:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
